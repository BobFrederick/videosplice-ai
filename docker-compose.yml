version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: splice-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: splice-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # For CPU-only, comment out the deploy section above

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: splice-backend
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WHISPER_API_URL=http://host.docker.internal:3001
      - OLLAMA_API_URL=http://ollama:11434
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      - redis
      - ollama
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: splice-frontend
    ports:
      - "5001:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis-data:
  ollama-models:
